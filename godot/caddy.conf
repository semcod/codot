:80 {
    root * /srv
    encode gzip

    # Health check
    handle /health {
        respond "OK" 200
    }

    # Auth-protected reverse proxy to LLM
    @llm_paths path /generate/* /fetch /context /metrics
    handle @llm_paths {
        forward_auth llm:8000 /auth {
            header_up Authorization {http.request.header.Authorization}
            header_up X-Original-URI {http.request.uri}
            header_up X-Original-Method {http.request.method}
        }
        reverse_proxy llm:8000
    }

    # Log requests
    log {
        output stdout
    }

    file_server
}
