global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'llm'
    static_configs:
      - targets: ['llm:8000']
    metrics_path: /metrics
  - job_name: 'schema-server'
    static_configs:
      - targets: ['schema-server:80']
    metrics_path: /metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
