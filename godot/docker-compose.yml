services:
  # Bundle validation and execution service
  godot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: godot-bundle-service
    volumes:
      - ./bundles:/app/bundles
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./generated:/app/generated
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - BUNDLE_SCHEMA_URI=http://schema-server:80/bundle.schema.json
      - TEMPORAL_HOST=temporal:7233
      - LOG_LEVEL=info
    ports:
      - "${GODOT_PORT_8080:-8080}:8080"
      - "${GODOT_PORT_8081:-8081}:8081"
      - "${GODOT_PORT_8082:-8082}:8082"
      - "${GODOT_PORT_8083:-8083}:8083"
    networks:
      - bundle-network
    command: tail -f /dev/null

  # Temporal server for workflow orchestration
  temporal:
    image: temporalio/auto-setup:latest
    container_name: temporal-server
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-temporal}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-temporal}
      - POSTGRES_SEEDS=postgres
    networks:
      - bundle-network
    depends_on:
      - postgres

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:latest
    container_name: temporal-ui
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - bundle-network
    depends_on:
      - temporal

  # PostgreSQL for Temporal
  postgres:
    image: postgres:13-alpine
    container_name: temporal-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-temporal}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-temporal}
      - POSTGRES_DB=${POSTGRES_DB:-temporal}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - bundle-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-audit.sql:/docker-entrypoint-initdb.d/99-init-audit.sql:ro

  # Schema server + Auth proxy (Caddy)
  schema-server:
    image: caddy:latest
    container_name: schema-server
    volumes:
      - ./bundle.schema.json:/srv/bundle.schema.json
      - ./caddy.conf:/etc/caddy/Caddyfile
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${SCHEMA_SERVER_PORT:-8084}:80"
    networks:
      - bundle-network

  # LiteLLM bundle generation + ACL service
  llm:
    build:
      context: .
      dockerfile: llm/Dockerfile
    container_name: godot-llm
    env_file:
      - ./llm/.env
    environment:
      - LLM_ACL_FILE=/app/acl.yaml
      - LLM_OFFLINE=true
      - BUNDLE_OUTPUT_DIR=/app/bundles/generated
      - BUNDLE_SCHEMA_FILE=/app/bundle.schema.json
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-temporal}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-temporal}
      - POSTGRES_DB=${POSTGRES_DB:-temporal}
    volumes:
      - ./llm:/app
      - ./bundles:/app/bundles
      - ./sample-data:/app/sample-data:ro
      - ./schemas:/app/schemas:ro
      - ./bundle.schema.json:/app/bundle.schema.json:ro
    ports:
      - "${LLM_PORT:-18094}:8000"
    networks:
      - bundle-network
    depends_on:
      - schema-server
      - mock-api

  # Mock API used for service and NLP tests
  mock-api:
    build:
      context: .
      dockerfile: llm/Dockerfile
    container_name: godot-mock-api
    env_file:
      - ./llm/.env
    volumes:
      - ./llm:/app
      - ./bundle.schema.json:/app/bundle.schema.json:ro
    command: uvicorn app:mock_app --host 0.0.0.0 --port 8001
    ports:
      - "${MOCK_API_PORT:-18095}:8001"
    networks:
      - bundle-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: bundle-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - bundle-network
    depends_on:
      - llm

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: bundle-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - bundle-network
    depends_on:
      - prometheus

networks:
  bundle-network:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
